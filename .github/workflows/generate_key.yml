name: Generate ADHD 1400-Char Key
on:
  workflow_dispatch:

jobs:
  update-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Salted Chaos Key
        run: |
          SALT="PRESSURE_WATER_PEGASUS_SATURN_HEXAGON_ISRAEL_bangaranga_eurovision"
          TIME_STEP=$(python3 -c "import time; print(int(time.time() // 1500))")
          REAL_HASH=$(echo -n "${TIME_STEP}${SALT}" | sha256sum | awk '{print $1}')
          TRASH=$(openssl rand -hex 700 | head -c 1300)
          echo "25_min_pass_GO_PASTE_THIS_RIGHT_NOW_${REAL_HASH}_${TRASH}" | head -c 1400 > active_key_1.txt
      - name: Commit and Push
        run: |
          git config --global user.name "Cron-Bot"
          git config --global user.email "bot@cron.com"
          git add active_key_1.txt
          git commit -m "Rotate hash with secure salt [15m interval]" || exit 0
          git push
